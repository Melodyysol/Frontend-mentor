    #reference {

      margin-bottom: 10px;
    }

      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    #input {
      border: 2px solid #000;
      padding: 10px;
      min-height: 45px;
      font-size: 20px;
      outline: none;
      white-space: pre-wrap;
    }

      color: #c8f7c5;

    .incorrect {

    }

    .locked {

<body>
  <div id="reference">Practice makes perfect</div>

  <div id="stats">
    <span>Time: <b id="time">0</b>s</span>
    <span>WPM: <b id="wpm">0</b></span>
    <span>Accuracy: <b id="accuracy">100</b>%</span>
  </div>

  <div
    id="input"
    contenteditable="true"
    spellcheck="false"
  ></div>

  <button id="restart">Restart</button>
</body>

      current += len;

    sel.removeAllRanges();
    sel.addRange(range);
  }
