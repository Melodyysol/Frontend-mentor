<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Typing Speed Test</title>
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div id="reference">Practice makes perfect</div>

  <div id="stats">
    <span>Time: <b id="time">0</b>s</span>
    <span>WPM: <b id="wpm">0</b></span>
    <span>Accuracy: <b id="accuracy">100</b>%</span>
  </div>

  <div id="input" contenteditable="true" spellcheck="false"></div>

  <button id="restart">Restart</button>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
